# Values for gateway-helm.
#
# The api-gateway (Node.js) pod has been decommissioned — Clerk auth moved into
# mvn-backend (see mvn-backend/CUTOVER.md). This chart now only manages the
# Istio ingress Gateway, the VirtualService routing api.simplefbo.com to
# mvn-backend-simplefbo-backend:8003, and the backend-clerk-env reference
# ConfigMap.

# Current environment
env: production

# Kemp forwards a TLS ClientHello to Istio :80 for webmail (mail is HTTP on
# the same port). Terminate TLS on :80 and pin plaintext HTTP to raw_buffer
# so the ClientHello cannot hit the HTTP codec (Cloudflare 520).
httpsOnHttpPort:
  enabled: true
  credentialName: simplefbo-cf-tls

# Clerk / backend auth env (required by simplefbo-backend after gateway cutover).
# These keys must exist on the secret referenced below (same keys used historically
# by api-gateway). Copy the env block from templates/backend-clerk-env.yaml into
# simplefbo-backend-helm if it is not already present.
backendClerk:
  enabled: true
  existingSecret: gateway-pg
  # Env var names injected for documentation / optional Secret mirror
  keys:
    CLERK_JWT_KEY: CLERK_JWT_KEY
    CLERK_WEBHOOK_SECRET: CLERK_WEBHOOK_SECRET

# Exposes ONLY Tempo's OTLP/HTTP trace-ingest path externally (no Grafana/Prometheus/
# Tempo UI or query API) so clients outside the cluster can report telemetry into the
# existing kube-prometheus-stack / Tempo instance (Helm release "monitoring") that
# mvn-backend already sends traces to.
#
# sharedSecret is committed here in plaintext (matches how backendClerk's secret refs
# are handled elsewhere in this chart) — acceptable for a private solo repo, but if this
# repo is ever made public or shared, rotate it first (regenerate with
# `openssl rand -hex 32`, update here, and update the client sending X-Telemetry-Key).
telemetryIngest:
  enabled: true
  host: otel.dbslone.com
  tempo:
    service: tempo.monitoring.svc.cluster.local
    httpPort: 4318
  sharedSecret: "0166652ffbdba2b4ed4365a95716a66e71c6ac7fb10941c6478e82eff05ad349"
