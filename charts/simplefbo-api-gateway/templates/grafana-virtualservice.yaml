{{- if .Values.grafanaUi.enabled }}
# https://graph.dbslone.com — Grafana UI. Login is Cloudflare Access (GitHub
# user dbslone). Do not add a second Istio Gateway.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: grafana-ui
  namespace: simplefbo
  labels:
    {{- include "gateway-helm.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.grafanaUi.host | quote }}
  gateways:
    - istio-ingress/api-gateway
  http:
    # Do not redirect /login to /. Grafana's Sign in button opens /login,
    # and sending it home makes that click return to the same screen.
    - route:
        - destination:
            host: {{ .Values.grafanaUi.service | quote }}
            port:
              number: {{ .Values.grafanaUi.port }}
{{- end }}
