{{- if .Values.grafanaUi.enabled }}
# https://graph.dbslone.com — Grafana UI. Login is Cloudflare Access (GitHub
# user dbslone). Do not add a second Istio Gateway.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: grafana-ui
  namespace: simplefbo
  labels:
    {{- include "gateway-helm.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.grafanaUi.host | quote }}
  gateways:
    - istio-ingress/api-gateway
  http:
    # Grafana's form is disabled. /login only renders "Welcome to Grafana"
    # with nothing to submit, so send people to the app.
    - match:
        - uri:
            exact: /login
        - uri:
            prefix: /login/
      redirect:
        redirectCode: 302
        uri: /
    - route:
        - destination:
            host: {{ .Values.grafanaUi.service | quote }}
            port:
              number: {{ .Values.grafanaUi.port }}
{{- end }}
