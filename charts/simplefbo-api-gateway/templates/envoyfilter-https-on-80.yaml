{{- if .Values.httpsOnHttpPort.enabled }}
# Istio will not put HTTP and HTTPS on the same Gateway port 80
# ("conflict with existing server"). EnvoyFilter adds a TLS chain so a
# ClientHello on :80 is terminated instead of parsed as HTTP/1.1
# (NO_REQUEST_LINE_IN_REQUEST → Cloudflare 520).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: https-on-80
  namespace: istio-ingress
spec:
  workloadSelector:
    labels:
      istio: ingress
  configPatches:
  - applyTo: LISTENER_FILTER
    match:
      context: GATEWAY
      listener:
        portNumber: 80
    patch:
      operation: INSERT_FIRST
      value:
        name: envoy.filters.listener.tls_inspector
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
  - applyTo: LISTENER_FILTER
    match:
      context: GATEWAY
      listener:
        portNumber: 80
    patch:
      operation: INSERT_FIRST
      value:
        name: envoy.filters.listener.proxy_protocol
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.listener.proxy_protocol.v3.ProxyProtocol
          allow_requests_without_proxy_protocol: true
  - applyTo: FILTER_CHAIN
    match:
      context: GATEWAY
      listener:
        portNumber: 80
    patch:
      operation: INSERT_FIRST
      value:
        filter_chain_match:
          transport_protocol: tls
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_params:
                tls_minimum_protocol_version: TLSv1_2
                cipher_suites:
                - ECDHE-RSA-AES256-GCM-SHA384
                - ECDHE-RSA-AES128-GCM-SHA256
              alpn_protocols:
              - h2
              - http/1.1
              tls_certificate_sds_secret_configs:
              - name: kubernetes://{{ .Values.httpsOnHttpPort.credentialName | default "simplefbo-cf-tls" }}
                sds_config:
                  ads: {}
                  resource_api_version: V3
            require_client_certificate: false
        filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: https_on_80
            codec_type: AUTO
            rds:
              route_config_name: https.443.https-dbslone.api-gateway.istio-ingress
              config_source:
                ads: {}
                resource_api_version: V3
            http_filters:
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
{{- end }}
