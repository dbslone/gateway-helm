# Merge these keys into Helm release `grafana` (namespace `monitoring`,
# chart grafana). Do not `helm upgrade -f` this file by itself — that resets
# datasources, persistence, the admin password, and the internal LoadBalancer.
#
# Cloudflare Access (GitHub, email dbslone@gmail.com) signs Grafana in through
# the Cf-Access-Authenticated-User-Email header. Anonymous access stays off:
# Grafana 12 will not treat an anonymous session as signed in, so the Sign in
# button would only open /login and return to the same screen.
env:
  GF_SERVER_ROOT_URL: https://graph.dbslone.com
  GF_AUTH_ANONYMOUS_ENABLED: "false"
  GF_AUTH_DISABLE_LOGIN_FORM: "false"
  GF_AUTH_PROXY_ENABLED: "true"
  GF_AUTH_PROXY_HEADER_NAME: Cf-Access-Authenticated-User-Email
  GF_AUTH_PROXY_HEADER_PROPERTY: email
  GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_USERS_AUTO_ASSIGN_ORG: "true"
  GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin

# Load ConfigMaps labeled grafana_dashboard=1 (the etcd disk dashboard, and the
# SimpleFBO dashboards already in this namespace). searchNamespace stays
# monitoring, which is where those ConfigMaps are created.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring
    folderAnnotation: grafana_folder
    provider:
      # Match the sidecar's grafana_folder subdirectories (etcd, SimpleFBO).
      foldersFromFilesStructure: true
