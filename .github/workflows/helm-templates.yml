name: Helm templates

on:
  pull_request:
  push:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: azure/setup-helm@v4
      - name: Gateway chart resources must carry helm.sh/chart
        run: tests/render-gateway.sh

  no-mail-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Mail stack charts must not be in this repo
        run: tests/no-mail-stack.sh

  helm-release-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: azure/setup-helm@v4
      - name: Helm repo index must not fail without temp/
        run: tests/helm-release-index.sh

  github-actions-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Workflows must use Node.js 24
        run: tests/github-actions-node24.sh
