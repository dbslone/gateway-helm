name: Helm templates

on:
  pull_request:
  push:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: azure/setup-helm@v4
      - name: Gateway chart resources must carry helm.sh/chart
        run: bash tests/render-gateway.sh
      - name: Render Grafana VirtualService for graph.dbslone.com
        run: bash tests/render-grafana-ui.sh
      - name: graph.dbslone.com/login must not serve the Welcome to Grafana screen
        run: bash tests/render-grafana-login.sh

  grafana-public-chunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Grafana chunk 192 must not be the Access login page
        run: bash tests/grafana-public-chunk.sh

  no-mail-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Mail stack charts must not be in this repo
        run: bash tests/no-mail-stack.sh

  helm-release-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: azure/setup-helm@v4
      - name: Helm repo index must not fail without temp/
        run: bash tests/helm-release-index.sh

  github-actions-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Workflows must use Node.js 24
        run: bash tests/github-actions-node24.sh

  ci-script-executable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Mail stack script must not fail with Permission denied
        run: bash tests/ci-script-executable.sh
