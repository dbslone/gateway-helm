name: Helm templates

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  render-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Gateway chart resources must carry helm.sh/chart
        run: tests/render-gateway.sh

  render-stalwart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Render Stalwart chart
        run: tests/render-stalwart.sh

  render-bulwark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Render Bulwark chart
        run: tests/render-bulwark.sh

  webmail-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Webmail TLS-on-:80 helm assertions
        env:
          SKIP_WEBMAIL_LIVE: "1"
        run: tests/webmail-origin.sh

  helm-release-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Helm repo index must not fail without temp/
        run: tests/helm-release-index.sh
