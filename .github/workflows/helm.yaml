name: Release Helm Charts

concurrency: release-helm

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'temp/**'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: 'src'
          ref: 'main'
          fetch-depth: 0

      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: 'dest'
          ref: 'gh-pages'
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update helm repo index
        id: index
        shell: bash
        working-directory: src
        env:
          HELM_REPO_URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/helm/
        run: |
          chmod +x scripts/release-helm-index.sh
          scripts/release-helm-index.sh
          if [[ -f ./temp/index.yaml ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit packaged charts on main
        if: steps.index.outputs.published == 'true'
        shell: bash
        working-directory: src
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/ || true
          if git diff --staged --quiet; then
            echo "No chart copies to commit"
          else
            git commit -m "Updated from ref: $GITHUB_SHA"
            git push
          fi

      - name: Push index to gh-pages
        if: steps.index.outputs.published == 'true'
        shell: bash
        working-directory: dest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/ index.yaml || true
          if git diff --staged --quiet; then
            echo "No index changes to commit"
          else
            git commit -m "Updated from ref: $GITHUB_SHA"
            git push
          fi
